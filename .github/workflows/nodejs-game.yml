name: CI — Game

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    paths:
      - 'game/**'

jobs:
  test-game:
    name: Test game package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (game)
        working-directory: ./game
        run: npm ci

      - name: Run tests (game)
        working-directory: ./game
        run: npm test --silent
